<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C&L 星空露營 | 好鄰居許願池</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Montserrat:ital,wght@0,700;0,900;1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --brand-blue: #0F172A; 
            --brand-gold: #F3C969; 
            --brand-green: #7AFFA6;
            --text-dark: #1A1A1A;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(243, 201, 105, 0.3);
            border-radius: 24px;
            padding: 40px 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .title {
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--brand-gold);
            margin-bottom: 10px;
            font-style: italic;
        }

        .subtitle {
            font-size: 15px;
            color: rgba(255,255,255,0.8);
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .highlight { color: var(--brand-green); font-weight: 700; font-size: 18px; }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .input-label {
            display: block;
            font-size: 13px;
            color: var(--brand-gold);
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        #my-name {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        #my-name:focus {
            border-color: var(--brand-gold);
            box-shadow: 0 0 15px rgba(243, 201, 105, 0.3);
        }
